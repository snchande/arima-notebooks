# Arima Notebooks Configuration
# ================================

# Build info (injected by Maven at build time via resource filtering — see pom.xml)
barista.version=@project.version@
barista.build.timestamp=@maven.build.timestamp@

# Server
server.port=8585
# Bind to loopback ONLY. Arima executes code in eight languages as the user who
# started it, and in the default 'local' auth mode nothing authenticates the
# caller - so anything that can reach this port can run code on this machine.
# Before this was set, the server listened on 0.0.0.0 and every device on the
# local network could do exactly that, unauthenticated.
server.address=127.0.0.1
spring.application.name=arima-notebooks

# Arima app directories
barista.notebooks.dir=notebooks
barista.data.dir=data

# Auth mode: "local" (default, uses OS username, no login required)
#            "oauth" (requires OAuth2 provider credentials in data/oauth-config.json)
barista.auth.mode=local

# Static resource serving (the web UI)
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# Jackson JSON settings
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# WebSocket settings
spring.websocket.message-size-limit=524288
spring.websocket.send-time-limit=20000
spring.websocket.send-buffer-size-limit=524288

# Logging
logging.level.com.barista=INFO
logging.level.org.springframework.web.socket=WARN
logging.level.org.springframework.messaging=WARN

# Increase max request size for large notebook uploads
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Graceful shutdown — drain in-flight requests before stopping
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=15s

# Actuator — expose health + shutdown endpoint only
management.endpoints.web.exposure.include=health,shutdown
# Reachable from this machine only - see LocalAccessFilter.
management.endpoint.shutdown.enabled=true
management.endpoint.health.show-details=always
# Actuator shares the main port (avoids port conflict on restart)
# management.server.port=8586
